{% extends "base.html" %}
{% block title %}Diary · {{ heading }}{% endblock %}
{% block content %}
<div class="page-head">
  <div class="eyebrow">Meals</div>
  <h1 class="title">{{ heading }}</h1>
</div>
{% if notice %}<p class="notice" role="status">{{ notice }}</p>{% endif %}
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form class="card" method="post" action="{{ action }}">
  <div class="row">
    <div class="field">
      <label class="label" for="name">Name</label>
      <input class="input" id="name" name="name" type="text" value="{{ draft.name }}" maxlength="100">
    </div>
    <div class="field">
      <label class="label" for="style">Style</label>
      <select class="input" id="style" name="style">
        {% for s in styles %}<option value="{{ s }}"{% if s == draft.style %} selected{% endif %}>{{ s }}</option>{% endfor %}
      </select>
    </div>
  </div>
  <div class="row">
    <div class="field">
      <label class="label" for="mins">Minutes</label>
      <input class="input" id="mins" name="mins" type="number" inputmode="numeric" min="1" max="1440" value="{{ draft.mins }}">
    </div>
    <div class="field">
      <label class="label" for="servings">Servings</label>
      <input class="input" id="servings" name="servings" type="number" inputmode="numeric" min="1" value="{{ draft.servings }}">
    </div>
  </div>
  <div class="label priorities-label">Tags</div>
  <div class="row" role="group" aria-label="Tags">
    {% for t in tags %}
    <label class="choice">
      <input type="checkbox" name="tags" value="{{ t }}"{% if t in draft.tags %} checked{% endif %}>
      <span class="choice-body option">{{ t }}</span>
    </label>
    {% endfor %}
  </div>
  <label class="label label-spaced" for="ingredients">Ingredients (one per line)</label>
  <textarea class="input textarea" id="ingredients" name="ingredients" rows="8">{{ draft.ingredients|join("\n") }}</textarea>
  <label class="label label-spaced" for="steps">Method (one step per line)</label>
  <textarea class="input textarea" id="steps" name="steps" rows="8">{{ draft.steps|join("\n") }}</textarea>
  <div class="row">
    <div class="field">
      <label class="label" for="source_url">Source web address (optional)</label>
      <input class="input" id="source_url" name="source_url" type="url" value="{{ draft.source_url }}" maxlength="500">
    </div>
    <div class="field">
      <label class="label" for="source_name">Source name (optional)</label>
      <input class="input" id="source_name" name="source_name" type="text" value="{{ draft.source_name }}" maxlength="100">
    </div>
  </div>
  <div class="row">
    <button class="btn btn-primary accent-bg" type="submit">Save</button>
    <a class="btn" href="{{ cancel }}">Cancel</a>
  </div>
</form>
{% endblock %}
