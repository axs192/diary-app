{% extends "base.html" %}
{% block title %}Diary · Log in{% endblock %}
{% block content %}
<div class="login">
  <h1 class="title">Diary</h1>
  <form class="card" method="post" action="/login">
    <label class="label" for="pin">Household PIN</label>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <input class="input" id="pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" autofocus>
    <button class="btn btn-primary accent-bg" type="submit">Open the diary</button>
  </form>
</div>
{% endblock %}
