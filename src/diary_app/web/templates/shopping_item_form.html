{% extends "base.html" %}
{% block title %}Diary · {{ item.name }}{% endblock %}
{% block content %}
<div class="page-head">
  <div class="eyebrow">Shopping</div>
  <h1 class="title">{{ item.name }}</h1>
</div>
<form class="card" method="post" action="/shopping/item/{{ item.id }}">
  <input type="hidden" name="week" value="{{ week }}">
  <label class="label" for="name">Name</label>
  <input class="input" id="name" name="name" type="text" maxlength="60" value="{{ item.name }}">
  <div class="inline-fields">
    <div class="field-grow">
      <label class="label" for="amount">Amount (optional)</label>
      <input class="input" id="amount" name="amount" type="number" inputmode="decimal" min="0" step="any" value="{{ amount_text }}">
    </div>
    <div class="field-grow">
      <label class="label" for="unit">Unit</label>
      <select class="input" id="unit" name="unit">{% for u in units %}<option value="{{ u }}"{% if u == unit %} selected{% endif %}>{{ u }}</option>{% endfor %}</select>
    </div>
  </div>
  <div class="row">
    <button class="btn btn-primary accent-bg" type="submit">Save</button>
    <a class="btn" href="{{ back }}">Cancel</a>
  </div>
</form>
<form method="post" action="/shopping/item/{{ item.id }}/delete">
  <input type="hidden" name="week" value="{{ week }}">
  {% if item.source == "meal" %}<p class="muted">Generating the list again brings it back if a dinner still needs it.</p>{% endif %}
  <button class="btn btn-danger" type="submit">Remove from the list</button>
</form>
{% endblock %}
