[project]
name = "diary-app"
version = "0.1.0"
description = "Family diary: meal plans, shopping lists and calendars (spike)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "msal>=1.39.0",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
diary-app = "diary_app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diary_app"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "ruff>=0.17.6",
    "semgrep>=1.79.0",
]

[tool.ruff]
line-length = 80
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "D", "ANN", "UP", "B", "S", "BLE", "PL", "G",
  "TD", "ARG", "SIM", "RUF", "TID252",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# msal ships no type hints.
module = "msal"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
